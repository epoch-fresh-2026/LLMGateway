openapi: 3.1.0
info:
  title: LLMGateway Admin API
  version: 1.0.0
  description: Machine-readable contract for the Dashboard management API.
servers:
  - url: /
# All management endpoints use the server-side session cookie. The auth
# endpoints opt out with `security: []` so clients can log in.
security:
  - cookieAuth: []
paths:
  /admin/stats/overview:
    get:
      operationId: getStatsOverview
      parameters: [$ref: '#/components/parameters/StartTime', $ref: '#/components/parameters/EndTime']
      responses: { '200': { $ref: '#/components/responses/Stats' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/stats/daily:
    get:
      operationId: getDailyStats
      parameters: [$ref: '#/components/parameters/DateFrom', $ref: '#/components/parameters/DateTo', $ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/DailyStatsList' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/stats/channels:
    get:
      operationId: getChannelStats
      parameters: [$ref: '#/components/parameters/StartTime', $ref: '#/components/parameters/EndTime']
      responses: { '200': { $ref: '#/components/responses/ChannelStatsList' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/stats/usage:
    get:
      operationId: getUsageAggregates
      parameters: [{$ref: '#/components/parameters/GroupBy'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: { '200': { $ref: '#/components/responses/UsageAggregateList' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/stats/ttft:
    get:
      operationId: getTTFTStats
      parameters: [$ref: '#/components/parameters/StartTime', $ref: '#/components/parameters/EndTime']
      responses: { '200': { $ref: '#/components/responses/TTFTStats' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/channels:
    get:
      operationId: listChannels
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/ChannelList' }, '400': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createChannel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelCreateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Channel' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}:
    parameters: [$ref: '#/components/parameters/Id']
    put:
      operationId: updateChannel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelUpdateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Channel' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteChannel
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/status:
    parameters: [$ref: '#/components/parameters/Id']
    put:
      operationId: updateChannelStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelStatusInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Channel' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/balance:
    parameters: [$ref: '#/components/parameters/Id']
    put:
      operationId: updateChannelBalance
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBalanceInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Channel' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/channels/health:
    get:
      operationId: listChannelHealth
      responses: { '200': { $ref: '#/components/responses/HealthList' } }
  /admin/breaker-config:
    description: Each user has one breaker policy shared by all owned channels. Effective settings resolve from process defaults to the user policy; counters, health states and probe leases remain independent per channel.
    get:
      operationId: getUserBreakerConfig
      responses: { '200': { $ref: '#/components/responses/BreakerConfig' } }
    put:
      operationId: updateUserBreakerConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBreakerConfigInput' } } } }
      responses: { '200': { $ref: '#/components/responses/BreakerConfig' }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteUserBreakerConfig
      responses: { '200': { $ref: '#/components/responses/Deleted' } }
  /admin/channels/{id}/health:
    parameters: [$ref: '#/components/parameters/Id']
    get:
      operationId: getChannelHealth
      responses: { '200': { $ref: '#/components/responses/Health' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/health/reset:
    parameters: [$ref: '#/components/parameters/Id']
    post:
      operationId: resetChannelHealth
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/models:
    parameters: [$ref: '#/components/parameters/Id']
    get:
      operationId: listChannelModels
      responses: { '200': { $ref: '#/components/responses/ChannelModelList' } }
    post:
      operationId: createChannelModel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelModelInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ChannelModel' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/models/{modelId}:
    parameters: [$ref: '#/components/parameters/Id', { $ref: '#/components/parameters/ModelId' }]
    put:
      operationId: updateChannelModel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelModelUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/ChannelModel' }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteChannelModel
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/channels/{id}/remote-models:
    parameters: [$ref: '#/components/parameters/Id']
    post:
      operationId: loadRemoteModels
      responses: { '200': { $ref: '#/components/responses/RemoteModels' } }
  /admin/channels/{id}/test:
    parameters: [$ref: '#/components/parameters/Id']
    post:
      operationId: testChannel
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { check_all: { type: boolean } } } } } }
      responses: { '200': { $ref: '#/components/responses/ChannelTest' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/models:
    get:
      operationId: listModels
      parameters: [{ in: query, name: status, schema: { type: integer, default: 1 } }, $ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/CatalogModelList' } }
  /admin/pricing:
    get:
      operationId: listPricing
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/PricingList' } }
    post:
      operationId: createPricing
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingCreateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Pricing' }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deletePricing
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeletePricingInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/profile:
    get:
      operationId: getProfile
      responses: { '200': { $ref: '#/components/responses/Account' }, '401': { $ref: '#/components/responses/Error' } }
    put:
      operationId: updateProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Account' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /admin/keys:
    get:
      operationId: listKeys
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/KeyList' } }
    post:
      operationId: createKey
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KeyCreateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/KeySecret' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/keys/{id}:
    parameters: [$ref: '#/components/parameters/Id']
    put:
      operationId: updateKey
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KeyUpdateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Key' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteKey
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/usage-logs:
    get:
      operationId: listUsageLogs
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize', { in: query, name: user_id, schema: { type: integer } }, { in: query, name: channel_id, schema: { type: integer } }, { in: query, name: model, schema: { type: string } }, { in: query, name: status, schema: { type: string } }, $ref: '#/components/parameters/StartTime', $ref: '#/components/parameters/EndTime']
      responses: { '200': { $ref: '#/components/responses/UsageLogList' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/usage-logs/{id}:
    parameters: [$ref: '#/components/parameters/Id']
    get:
      operationId: getUsageLog
      responses: { '200': { $ref: '#/components/responses/UsageLog' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/rate-limits:
    get:
      operationId: listRateLimits
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/RateLimitList' } }
    post:
      operationId: createRateLimit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitCreateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/RateLimit' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/rate-limits/{id}:
    parameters: [$ref: '#/components/parameters/Id']
    put:
      operationId: updateRateLimit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitUpdateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/RateLimit' }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteRateLimit
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/quota-policies:
    get:
      operationId: listQuotaPolicies
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/QuotaPolicyList' } }
    post:
      operationId: createQuotaPolicy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaPolicyCreateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/QuotaPolicy' }, '400': { $ref: '#/components/responses/Error' } }
  /admin/quota-policies/{id}:
    parameters: [$ref: '#/components/parameters/Id']
    delete:
      operationId: deleteQuotaPolicy
      responses: { '200': { $ref: '#/components/responses/Deleted' }, '404': { $ref: '#/components/responses/Error' } }
  /admin/quota-usage:
    get:
      operationId: listQuotaUsage
      parameters: [$ref: '#/components/parameters/Page', $ref: '#/components/parameters/PageSize']
      responses: { '200': { $ref: '#/components/responses/QuotaUsageList' } }
  /admin/auth/register:
    post:
      operationId: registerAccount
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthCredentialsInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Account' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /admin/auth/login:
    post:
      operationId: loginAccount
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthCredentialsInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Account' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /admin/auth/logout:
    post:
      operationId: logoutAccount
      security: []
      responses: { '200': { description: Logged out, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponse' } } } }, '401': { $ref: '#/components/responses/Error' } }
  /admin/auth/me:
    get:
      operationId: getCurrentAccount
      security: []
      responses: { '200': { $ref: '#/components/responses/Account' }, '401': { $ref: '#/components/responses/Error' } }
  /healthz:
    get:
      operationId: health
      responses: { '200': { description: Healthy, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, const: ok } } } } } } }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: llmgateway_session }
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: integer } }
    ModelId: { in: path, name: modelId, required: true, schema: { type: integer } }
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 1000, default: 20 } }
    StartTime: { in: query, name: start_time, schema: { type: string, format: date-time } }
    EndTime: { in: query, name: end_time, schema: { type: string, format: date-time } }
    DateFrom: { in: query, name: date_from, schema: { type: string, format: date } }
    DateTo: { in: query, name: date_to, schema: { type: string, format: date } }
    GroupBy: { in: query, name: group_by, required: true, schema: { type: string, enum: [user, api_key, model, channel] } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } } }
    Account: { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseAccount' } } } }
    Stats: { description: Stats, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseStats' } } } }
    TTFTStats: { description: TTFT statistics, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseTTFTStats' } } } }
    Deleted: { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseDeleted' } } } }
    Channel: { description: Channel, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannel' } } } }
    ChannelList: { description: Channels, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannelList' } } } }
    HealthList: { description: Health, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseHealthList' } } } }
    Health: { description: Channel health, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseHealth' } } } }
    BreakerConfig: { description: Owner breaker config, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseBreakerConfig' } } } }
    ChannelModel: { description: Channel model, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannelModel' } } } }
    ChannelModelList: { description: Channel models, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannelModelList' } } } }
    RemoteModels: { description: Remote models, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseRemoteModels' } } } }
    ChannelTest: { description: Channel test, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannelTest' } } } }
    CatalogModelList: { description: Catalog models, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseCatalogModelList' } } } }
    Pricing: { description: Pricing, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponsePricing' } } } }
    PricingList: { description: Pricing list, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponsePricingList' } } } }
    Key: { description: Key, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseKey' } } } }
    KeyList: { description: Keys, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseKeyList' } } } }
    KeySecret: { description: Key secret, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseKeySecret' } } } }
    UsageLog: { description: Usage log, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseUsageLog' } } } }
    UsageLogList: { description: Usage logs, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseUsageLogList' } } } }
    DailyStatsList: { description: Daily stats, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseDailyStatsList' } } } }
    ChannelStatsList: { description: Channel stats, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseChannelStatsList' } } } }
    UsageAggregateList: { description: Usage aggregates, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseUsageAggregateList' } } } }
    RateLimit: { description: Rate limit, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseRateLimit' } } } }
    RateLimitList: { description: Rate limits, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseRateLimitList' } } } }
    QuotaPolicy: { description: Quota policy, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseQuotaPolicy' } } } }
    QuotaPolicyList: { description: Quota policies, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseQuotaPolicyList' } } } }
    QuotaUsageList: { description: Quota usage, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponseQuotaUsageList' } } } }
  schemas:
    AdminError: { type: object, required: [code, message, data], properties: { code: { type: integer, minimum: 1 }, message: { type: string }, error_code: { type: string, description: Stable machine-readable code the dashboard localizes. }, data: { type: object } } }
    AdminResponse: { type: object, required: [code, message, data], properties: { code: { type: integer, const: 0 }, message: { type: string, const: ok }, data: {} } }
    List: { type: object, required: [list, total], properties: { list: { type: array, items: {} }, total: { type: integer } } }
    Money: { type: string, pattern: '^-?\\d+(\\.\\d+)?$' }
    Channel: { type: object, required: [id, name, base_url, auth_type, status, weight, priority, balance, model_count], properties: { id: { type: integer }, name: { type: string }, base_url: { type: string, format: uri }, auth_type: { type: string }, status: { type: integer }, weight: { type: integer }, priority: { type: integer }, balance: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }, model_count: { type: integer } } }
    ChannelCreateInput: { type: object, required: [name, base_url, api_key], properties: { name: { type: string }, base_url: { type: string, format: uri }, api_key: { type: string, writeOnly: true }, auth_type: { type: string }, status: { type: integer }, weight: { type: integer }, priority: { type: integer }, balance: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] } } }
    ChannelUpdateInput: { type: object, properties: { name: { type: string }, base_url: { type: string, format: uri }, api_key: { type: string, writeOnly: true }, auth_type: { type: string }, status: { type: integer }, weight: { type: integer }, priority: { type: integer }, balance: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] } } }
    ChannelStatusInput: { type: object, required: [status], properties: { status: { type: integer } } }
    ChannelBalanceInput: { allOf: [{ type: object, properties: { balance: { $ref: '#/components/schemas/Money' }, delta: { $ref: '#/components/schemas/Money' }, description: { type: string } } }, { oneOf: [{ required: [balance] }, { required: [delta] }] }] }
    ChannelModel: { type: object, required: [id, model_name, upstream_model, enabled], properties: { id: { type: integer }, model_name: { type: string }, upstream_model: { type: string }, enabled: { type: boolean } } }
    ChannelModelInput: { type: object, required: [model_name, upstream_model, enabled], properties: { model_name: { type: string }, upstream_model: { type: string }, enabled: { type: boolean } } }
    ChannelModelUpdate: { type: object, required: [enabled], properties: { model_name: { type: string, description: Renames the public alias; the upstream model name is upstream-owned and cannot change. }, enabled: { type: boolean } } }
    Health: { type: object, required: [channel_id, state, consecutive_failures, success_count, failure_count, opened_at, updated_at], properties: { channel_id: { type: integer }, state: { type: string, enum: [closed, open, half-open] }, consecutive_failures: { type: integer }, success_count: { type: integer }, failure_count: { type: integer }, opened_at: { type: [string, 'null'], format: date-time }, updated_at: { type: string, format: date-time } } }
    BreakerConfig: { type: object, required: [window_seconds, minimum_samples, error_rate_percent, timeout_rate_percent, cooldown_seconds], properties: { window_seconds: { type: integer }, minimum_samples: { type: integer }, error_rate_percent: { type: integer }, timeout_rate_percent: { type: integer }, cooldown_seconds: { type: integer } } }
    ChannelBreakerConfigInput: { type: object, required: [window_seconds, minimum_samples, error_rate_percent, timeout_rate_percent, cooldown_seconds], properties: { window_seconds: { type: integer, minimum: 1 }, minimum_samples: { type: integer, minimum: 1 }, error_rate_percent: { type: integer, minimum: 1, maximum: 100 }, timeout_rate_percent: { type: integer, minimum: 1, maximum: 100 }, cooldown_seconds: { type: integer, minimum: 1 } } }
    Pricing: { type: object, required: [id, channel_id, channel_name, upstream_model, input_price_per_1m, output_price_per_1m, cached_input_price_per_1m, currency], properties: { id: { type: integer }, channel_id: { type: integer }, channel_name: { type: string }, upstream_model: { type: string }, input_price_per_1m: { $ref: '#/components/schemas/Money' }, output_price_per_1m: { $ref: '#/components/schemas/Money' }, cached_input_price_per_1m: { $ref: '#/components/schemas/Money' }, currency: { type: string } } }
    PricingCreateInput: { type: object, required: [channel_id, upstream_model, input_price_per_1m, output_price_per_1m, currency], properties: { channel_id: { type: integer }, upstream_model: { type: string }, input_price_per_1m: { $ref: '#/components/schemas/Money' }, output_price_per_1m: { $ref: '#/components/schemas/Money' }, cached_input_price_per_1m: { $ref: '#/components/schemas/Money' }, currency: { type: string } } }
    DeletePricingInput: { type: object, required: [channel_id, upstream_model], properties: { channel_id: { type: integer }, upstream_model: { type: string } } }
    CatalogChannel: { type: object, required: [channel_id, channel_name, upstream_model, enabled], properties: { channel_id: { type: integer }, channel_name: { type: string }, upstream_model: { type: string }, enabled: { type: boolean } } }
    CatalogModel: { type: object, required: [model_name, status, channels], properties: { model_name: { type: string }, status: { type: integer }, channels: { type: array, items: { $ref: '#/components/schemas/CatalogChannel' } } } }
    Account: { type: object, required: [id, username, nickname], properties: { id: { type: integer }, username: { type: string }, nickname: { type: string } } }
    AuthCredentialsInput: { type: object, required: [username, password], properties: { username: { type: string, minLength: 3, maxLength: 64 }, password: { type: string, minLength: 8, maxLength: 72, writeOnly: true } } }
    AdminResponseAccount: { allOf: [{ $ref: '#/components/schemas/AdminResponse' }], properties: { data: { $ref: '#/components/schemas/Account' } } }
