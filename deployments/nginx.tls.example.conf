# HTTPS example for public deployments. Replace the certificate paths and
# server_name, then mount this file over /etc/nginx/conf.d/default.conf (or
# replace deployments/nginx.conf) and expose 443 instead of 80.
#
# Keep SESSION_COOKIE_SECURE=true in deployments/.env so the session cookie is
# only sent over HTTPS.

server {
    listen 80;
    server_name llmgateway.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llmgateway.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /admin {
        proxy_pass http://llmgateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1 {
        client_max_body_size 32m;
        proxy_pass http://llmgateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://llmgateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
