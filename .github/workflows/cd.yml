name: CD

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production-verification
  cancel-in-progress: false

jobs:
  verify-production:
    name: production health / dashboard / auth
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production checks
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public production deployment
        env:
          DEPLOYMENT_URL: https://llmgateway-mauve.vercel.app
        run: node scripts/verify-deployment.mjs
